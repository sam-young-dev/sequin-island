backend:
  name: git-gateway
  branch: main

local_backend: true
site_url: https://sam-studio-6.netlify.app/
display_url: https://sam-studio-6.netlify.app/
logo_url: /seguin-island-logo.jpg
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: home
    label: Home Page
    files:
      - name: home
        label: Home Page Content
        file: src/content/home/index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hero Eyebrow, name: heroEyebrow, widget: string }
          - { label: Hero Heading, name: heroHeading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Primary CTA Label, name: primaryCtaLabel, widget: string }
          - { label: Primary CTA Body, name: primaryCtaBody, widget: text }
          - { label: Primary CTA Link, name: primaryCtaHref, widget: string }
          - {
              label: Secondary CTA Label,
              name: secondaryCtaLabel,
              widget: string,
            }
          - {
              label: Secondary CTA Body,
              name: secondaryCtaBody,
              widget: text,
            }
          - {
              label: Secondary CTA Link,
              name: secondaryCtaHref,
              widget: string,
            }
          - {
              label: Evidence Heading,
              name: evidenceHeading,
              widget: string,
            }
          - { label: Evidence Body, name: evidenceBody, widget: text }
          - {
              label: Gallery Heading,
              name: galleryHeading,
              widget: string,
            }
          - label: Gallery Photos
            name: galleryPhotos
            widget: list
            fields:
              - label: Photo
                name: image
                widget: image
                media_folder: /public/images/gallery
                public_folder: /images/gallery
              - label: Alt Text
                name: alt
                widget: string
                hint: Describe what's in the photo for screen readers.
              - label: Caption
                name: caption
                widget: string
          - { label: Blog Heading, name: blogHeading, widget: string }
          - { label: Body, name: body, widget: markdown }

  - name: membership
    label: Membership Page
    files:
      - name: membership
        label: Membership Page Content
        file: src/content/membership/index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - {
              label: Eyebrow,
              name: eyebrow,
              widget: string,
              required: false,
              hint: "Small label shown above the page title, e.g. 'Support the Island'.",
            }
          - {
              label: CTA Button Label,
              name: ctaLabel,
              widget: string,
              hint: "e.g. 'Purchase Membership'",
            }
          - {
              label: CTA Link,
              name: ctaHref,
              widget: string,
              hint: "The external ejoinme.org membership checkout link.",
            }
          - {
              label: CTA Note,
              name: ctaNote,
              widget: string,
              required: false,
              hint: "Small print shown under the CTA button.",
            }
          - {
              label: Comparison Section Heading,
              name: tiersHeading,
              widget: string,
              default: "Compare Membership Levels",
              hint: "Heading shown above the tier comparison.",
            }
          - {
              label: Sustaining Membership Note,
              name: sustainingNote,
              widget: string,
              required: false,
              hint: "e.g. 'Become a sustaining member for just $10 a month.'",
            }
          - label: Membership Tiers
            name: tiers
            widget: list
            summary: "{{fields.name}} — {{fields.price}}"
            hint: "List levels from lowest to highest price so the comparison reads left to right."
            fields:
              - { label: Tier Name, name: name, widget: string }
              - {
                  label: Price,
                  name: price,
                  widget: string,
                  hint: "e.g. '$50' or '$1000+'",
                }
              - label: Benefits
                name: benefits
                widget: list
                hint: "Each tier should list ALL of its benefits, including the ones shared with lower tiers, so the page can compare them."
                field: { label: Benefit, name: benefit, widget: string }

  - name: pages
    label: Site Pages
    folder: src/content/pages
    create: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - {
          label: Eyebrow,
          name: eyebrow,
          widget: string,
          required: false,
          hint: "Small label shown above the page title, e.g. 'Our Story'.",
        }
      - { label: Body, name: body, widget: markdown }

  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish Date, name: publishDate, widget: datetime }
      - { label: Excerpt, name: excerpt, widget: text }
      - {
          label: Draft,
          name: draft,
          widget: boolean,
          required: false,
          default: false,
        }
      - { label: Body, name: body, widget: markdown }
